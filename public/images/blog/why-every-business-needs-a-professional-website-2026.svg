<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#030C1C"/>
      <stop offset="50%" stopColor="#071A33"/>
      <stop offset="100%" stopColor="#0B1F4B"/>
    </linearGradient>

    <linearGradient id="cyan-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#00D1FF"/>
      <stop offset="100%" stopColor="#3BA9FF"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="60%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#00D1FF"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#081E40" stopOpacity="0.95"/>
      <stop offset="100%" stopColor="#031127" stopOpacity="0.98"/>
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#00D1FF" flood-opacity="0.25"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D1FF" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>
  <rect width="1200" height="675" fill="url(#tech-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="260" fill="#00D1FF" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="980" cy="420" r="300" fill="#3BA9FF" fill-opacity="0.10" filter="blur(90px)"/>
  <circle cx="600" cy="620" r="220" fill="#00D1FF" fill-opacity="0.08" filter="blur(70px)"/>

  <!-- 2. Decorative Network Constellation Lines -->
  <g opacity="0.2" stroke="#00D1FF" stroke-width="1.2" stroke-dasharray="4 6">
    <line x1="80" y1="120" x2="300" y2="80"/>
    <line x1="300" y1="80" x2="480" y2="150"/>
    <line x1="850" y1="90" x2="1050" y2="160"/>
    <line x1="1050" y1="160" x2="1140" y2="280"/>
    <line x1="100" y1="520" x2="280" y2="600"/>
    <line x1="900" y1="580" x2="1120" y2="520"/>
  </g>
  <g fill="#00D1FF" opacity="0.4">
    <circle cx="300" cy="80" r="3"/>
    <circle cx="480" cy="150" r="2.5"/>
    <circle cx="850" cy="90" r="3"/>
    <circle cx="1050" cy="160" r="3.5"/>
    <circle cx="280" cy="600" r="2.5"/>
  </g>

  <!-- 3. Top Brand Tag -->
  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#071A33" stroke="#00D1FF" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- Logo Icon -->
    <path d="M 22 10 L 30 24 L 25 24 L 20 15 L 15 24 L 10 24 Z" fill="#00D1FF"/>
    <polygon points="20,13 25,23 21,23 18,17" fill="#FFFFFF"/>
    <text x="38" y="22" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" letter-spacing="2.5">TITAN AI AGENCY</text>
  </g>

  <!-- Category / Year Badge -->
  <g transform="translate(970, 48)">
    <rect width="170" height="34" rx="17" fill="#00D1FF" fill-opacity="0.12" stroke="#00D1FF" stroke-width="1.2"/>
    <circle cx="22" cy="17" r="4" fill="#00D1FF"/>
    <text x="36" y="22" fill="#00D1FF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" letter-spacing="1.5">2026 STRATEGY</text>
  </g>

  <!-- 4. Main Hero Typography Block -->
  <g transform="translate(60, 138)">
    <!-- Main Headline -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-0.5">
      WHY EVERY BUSINESS NEEDS
    </text>
    <text x="0" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="url(#cyan-blue-grad)" letter-spacing="-0.5">
      A PROFESSIONAL WEBSITE IN 2026
    </text>

    <!-- Small Subtitle / Pillars Text -->
    <g transform="translate(0, 86)">
      <rect width="520" height="32" rx="8" fill="#031127" fill-opacity="0.8" stroke="#3BA9FF" stroke-width="1" stroke-opacity="0.3"/>
      <text x="16" y="21" fill="#EAF7FF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1">
        <tspan fill="#00D1FF">Build Trust</tspan> • <tspan fill="#FFFFFF">Get Found</tspan> • <tspan fill="#00D1FF">Generate Leads</tspan> • <tspan fill="#3BA9FF">Automate</tspan>
      </text>
    </g>
  </g>

  <!-- 5. Central Visual: High-Tech Enterprise Laptop & Business Ecosystem -->
  <!-- Laptop Container -->
  <g transform="translate(420, 260)" filter="url(#subtle-shadow)">
    <!-- Laptop Screen Outer Frame -->
    <rect x="70" y="20" width="560" height="330" rx="14" fill="#020914" stroke="#3BA9FF" stroke-width="2.5" stroke-opacity="0.6"/>
    
    <!-- Screen Inner Display -->
    <rect x="80" y="30" width="540" height="300" rx="8" fill="#06162E"/>

    <!-- Browser Chrome Bar -->
    <rect x="80" y="30" width="540" height="28" fill="#030C1A"/>
    <circle cx="96" cy="44" r="4.5" fill="#EF4444"/>
    <circle cx="110" cy="44" r="4.5" fill="#F59E0B"/>
    <circle cx="124" cy="44" r="4.5" fill="#10B981"/>
    
    <!-- Browser URL Pill -->
    <rect x="146" y="36" width="260" height="17" rx="8" fill="#081E40" stroke="#00D1FF" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="162" y="48" fill="#EAF7FF" font-family="monospace" font-size="9">https://yourbusiness.com</text>
    <rect x="420" y="37" width="55" height="15" rx="4" fill="#00D1FF" fill-opacity="0.15"/>
    <text x="428" y="48" fill="#00D1FF" font-family="system-ui, sans-serif" font-weight="700" font-size="8">SSL SECURE</text>

    <!-- Website Inside Screen: Hero Section Mockup -->
    <g transform="translate(80, 58)">
      <!-- Navbar inside site -->
      <rect width="540" height="32" fill="#071C38"/>
      <rect x="20" y="10" width="60" height="12" rx="3" fill="#00D1FF"/>
      <rect x="360" y="9" width="40" height="14" rx="4" fill="#0B2B57"/>
      <rect x="410" y="9" width="45" height="14" rx="4" fill="#0B2B57"/>
      <rect x="465" y="7" width="55" height="18" rx="9" fill="url(#cyan-blue-grad)"/>

      <!-- Site Content -->
      <g transform="translate(25, 45)">
        <rect width="110" height="14" rx="7" fill="#00D1FF" fill-opacity="0.2"/>
        <text x="8" y="10" fill="#00D1FF" font-family="system-ui, sans-serif" font-weight="700" font-size="8">PREMIUM ENTERPRISE</text>
        <rect x="0" y="24" width="260" height="18" rx="4" fill="#FFFFFF"/>
        <rect x="0" y="48" width="220" height="12" rx="3" fill="#EAF7FF" fill-opacity="0.8"/>
        <rect x="0" y="66" width="180" height="8" rx="2" fill="#8FA0BA"/>
        
        <!-- CTA buttons inside site -->
        <rect x="0" y="86" width="95" height="24" rx="6" fill="url(#cyan-blue-grad)"/>
        <rect x="105" y="86" width="85" height="24" rx="6" fill="#0A244A" stroke="#3BA9FF" stroke-width="1"/>

        <!-- Mini Feature Cards inside site -->
        <g transform="translate(0, 126)">
          <rect x="0" y="0" width="80" height="50" rx="6" fill="#041226" stroke="#00D1FF" stroke-width="0.8" stroke-opacity="0.4"/>
          <circle cx="16" cy="16" r="6" fill="#00D1FF" fill-opacity="0.3"/>
          <rect x="8" y="28" width="45" height="6" rx="2" fill="#FFFFFF"/>
          <rect x="8" y="38" width="60" height="4" rx="2" fill="#8FA0BA"/>

          <rect x="90" y="0" width="80" height="50" rx="6" fill="#041226" stroke="#00D1FF" stroke-width="0.8" stroke-opacity="0.4"/>
          <circle cx="106" cy="16" r="6" fill="#3BA9FF" fill-opacity="0.3"/>
          <rect x="98" y="28" width="50" height="6" rx="2" fill="#FFFFFF"/>
          <rect x="98" y="38" width="60" height="4" rx="2" fill="#8FA0BA"/>

          <rect x="180" y="0" width="80" height="50" rx="6" fill="#041226" stroke="#00D1FF" stroke-width="0.8" stroke-opacity="0.4"/>
          <circle cx="196" cy="16" r="6" fill="#25D366" fill-opacity="0.3"/>
          <rect x="188" y="28" width="45" height="6" rx="2" fill="#FFFFFF"/>
          <rect x="188" y="38" width="60" height="4" rx="2" fill="#8FA0BA"/>
        </g>
      </g>

      <!-- Right Side Visual inside site (Interactive dashboard preview) -->
      <g transform="translate(320, 45)">
        <rect width="190" height="175" rx="8" fill="#030E1F" stroke="#3BA9FF" stroke-width="1" stroke-opacity="0.3"/>
        <text x="14" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="10">Automated Pipeline</text>
        <!-- Mini Analytics inside laptop -->
        <path d="M 20 120 L 50 95 L 85 110 L 120 70 L 160 50" fill="none" stroke="#00D1FF" stroke-width="2.5"/>
        <circle cx="160" cy="50" r="4" fill="#00D1FF"/>
        <rect x="20" y="140" width="65" height="18" rx="4" fill="#25D366" fill-opacity="0.2"/>
        <text x="26" y="153" fill="#25D366" font-family="system-ui, sans-serif" font-weight="700" font-size="9">CRM Synced</text>
      </g>
    </g>

    <!-- Laptop Base / Hinge -->
    <path d="M 30 350 L 670 350 L 695 366 L 5 366 Z" fill="#091E3A" stroke="#00D1FF" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="310" y="350" width="80" height="5" rx="2" fill="#00D1FF" fill-opacity="0.6"/>
    <!-- Desk Surface Glow Reflection -->
    <ellipse cx="350" cy="372" rx="340" ry="12" fill="#00D1FF" fill-opacity="0.15" filter="blur(10px)"/>
  </g>

  <!-- 6. Floating Google Search & SEO Visibility Badge (Top Left of Laptop) -->
  <g transform="translate(60, 310)" filter="url(#card-glow)">
    <rect width="320" height="95" rx="14" fill="url(#card-grad)" stroke="#00D1FF" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <!-- Google 'G' icon representation -->
      <circle cx="14" cy="14" r="14" fill="#FFFFFF"/>
      <text x="9" y="19" fill="#4285F4" font-family="system-ui, sans-serif" font-weight="900" font-size="15">G</text>
      <rect x="36" y="2" width="180" height="24" rx="12" fill="#041226" stroke="#3BA9FF" stroke-width="1" stroke-opacity="0.5"/>
      <text x="48" y="17" fill="#EAF7FF" font-family="system-ui, sans-serif" font-size="9.5">website design company Riyadh</text>
      <rect x="224" y="5" width="60" height="18" rx="4" fill="#10B981"/>
      <text x="232" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="8.5">RANK #1</text>
      
      <!-- SERP Subtext -->
      <g transform="translate(0, 38)">
        <text x="4" y="14" fill="#00D1FF" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Google Search Visibility &amp; SEO</text>
        <text x="4" y="28" fill="#8FA0BA" font-family="system-ui, sans-serif" font-size="9.5">Direct organic customer discovery 24/7</text>
      </g>
    </g>
  </g>

  <!-- 7. Floating WhatsApp Direct Integration Badge (Bottom Left) -->
  <g transform="translate(60, 435)" filter="url(#subtle-shadow)">
    <rect width="320" height="88" rx="14" fill="url(#card-grad)" stroke="#25D366" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <!-- Official WhatsApp Green Circle -->
      <circle cx="24" cy="24" r="22" fill="#25D366"/>
      <!-- WhatsApp Phone Path -->
      <path d="M 24 10 C 16.3 10 10 16.3 10 24 C 10 26.6 10.7 29.1 12 31.2 L 10.5 37 L 16.5 35.5 C 18.7 36.7 21.3 37.5 24 37.5 C 31.7 37.5 38 31.2 38 24 C 38 16.3 31.7 10 24 10 Z" fill="#FFFFFF"/>
      <path d="M 28 26.5 C 27.5 27.8 25.5 29 24.2 29 C 22.8 29 20 27.5 18 24 C 16.5 21.3 17.5 19.5 18.5 18.8 C 18.8 18.5 19.3 18.5 19.6 19.1 C 20.2 20.3 20.8 21.6 20.8 21.8 C 20.9 22.1 20.7 22.4 20.4 22.7 C 20.1 23 19.8 23.3 20.3 24.1 C 20.8 25 21.8 25.8 22.8 26.3 C 23.5 26.7 24 26.4 24.3 26 C 24.6 25.6 25.3 24.7 25.7 24.9 C 26.1 25.1 27.5 25.8 27.8 26 C 28.1 26.2 28.1 26.3 28 26.5 Z" fill="#25D366"/>

      <g transform="translate(56, 4)">
        <text x="0" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="12.5">Direct WhatsApp Capture</text>
        <text x="0" y="32" fill="#EAF7FF" font-family="system-ui, sans-serif" font-size="10">Zero dropped leads • Instant engagement</text>
        <rect x="0" y="38" width="130" height="15" rx="3" fill="#25D366" fill-opacity="0.18"/>
        <text x="6" y="49" fill="#25D366" font-family="monospace" font-weight="700" font-size="8.5">+966 Direct Inquiries</text>
      </g>
    </g>
  </g>

  <!-- 8. Floating Analytics & Conversion Growth Card (Top Right) -->
  <g transform="translate(860, 160)" filter="url(#card-glow)">
    <rect width="280" height="125" rx="14" fill="url(#card-grad)" stroke="#00D1FF" stroke-width="1.5"/>
    <g transform="translate(18, 16)">
      <text x="0" y="14" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Lead Conversion Growth</text>
      <text x="0" y="36" fill="#00D1FF" font-family="system-ui, sans-serif" font-weight="800" font-size="22">+340%</text>
      <text x="90" y="34" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11">▲ Qualified Enquiries</text>
      
      <!-- Mini Chart -->
      <path d="M 0 75 Q 50 65 100 45 T 200 20 T 240 10" fill="none" stroke="#00D1FF" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0 75 Q 50 65 100 45 T 200 20 T 240 10 L 240 85 L 0 85 Z" fill="#00D1FF" fill-opacity="0.1"/>
      <circle cx="240" cy="10" r="5" fill="#00D1FF" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>

  <!-- 9. Floating AI Automation & 24/7 Agent Badge (Bottom Right) -->
  <g transform="translate(860, 485)" filter="url(#subtle-shadow)">
    <rect width="280" height="100" rx="14" fill="url(#card-grad)" stroke="#3BA9FF" stroke-width="1.5"/>
    <g transform="translate(16, 16)">
      <circle cx="20" cy="20" r="16" fill="#00D1FF" fill-opacity="0.15" stroke="#00D1FF" stroke-width="1"/>
      <!-- Neural network / AI Icon -->
      <circle cx="14" cy="16" r="2.5" fill="#00D1FF"/>
      <circle cx="26" cy="14" r="2.5" fill="#3BA9FF"/>
      <circle cx="20" cy="25" r="2.5" fill="#FFFFFF"/>
      <line x1="14" y1="16" x2="26" y2="14" stroke="#00D1FF" stroke-width="1"/>
      <line x1="14" y1="16" x2="20" y2="25" stroke="#00D1FF" stroke-width="1"/>
      <line x1="26" y1="14" x2="20" y2="25" stroke="#3BA9FF" stroke-width="1"/>

      <g transform="translate(48, 4)">
        <text x="0" y="14" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="12">AI Chatbot &amp; Voice Agents</text>
        <text x="0" y="30" fill="#8FA0BA" font-family="system-ui, sans-serif" font-size="9.5">Answers questions &amp; qualifies leads</text>
        <rect x="0" y="38" width="90" height="16" rx="4" fill="#00D1FF" fill-opacity="0.15"/>
        <text x="8" y="50" fill="#00D1FF" font-family="monospace" font-weight="700" font-size="8.5">24/7/365 ACTIVE</text>
      </g>
    </g>
  </g>

  <!-- 10. Bottom Trust Strip -->
  <g transform="translate(60, 610)">
    <rect width="1080" height="34" rx="8" fill="#041226" fill-opacity="0.9" stroke="#3BA9FF" stroke-width="0.8" stroke-opacity="0.2"/>
    <text x="24" y="21" fill="#8FA0BA" font-family="system-ui, sans-serif" font-size="11">
      <tspan fill="#00D1FF" font-weight="700">TITAN AI AGENCY</tspan> — Web Architecture • Google Search Visibility • AI Assistants • WhatsApp Automation
    </text>
    <text x="960" y="21" fill="#3BA9FF" font-family="system-ui, sans-serif" font-weight="700" font-size="11">
      SAUDI ARABIA &amp; GLOBAL
    </text>
  </g>
</svg>
